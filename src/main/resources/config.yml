###############################################################################
#                           Mo’Afks configuration                             #
###############################################################################
# A player goes AFK with /afk or after standing idle. While AFK, nothing hurts
# or moves them, and the protection can't be used to gain anything. Messages
# live in lang/<language>.yml and use MiniMessage. Every key here has a
# default, so you can delete the ones you don't change. /moafks reload applies
# changes without a restart.

enabled: true   # false turns the plugin off; nobody goes AFK.
debug: false    # true logs who goes AFK and why, and how each language was picked.

locales:
  # Players nothing else matches, and the console, get this language.
  default: en
  # Where a player's language comes from, tried in order:
  #   ip     — the country of their IP address, through the lists below;
  #   client — the language set in their game, when a lang/ file matches it.
  sources: [ ip, client ]
  # Language → the ISO 3166 country codes that get it. Add a lang/it.yml and an
  # “it: [ IT, SM, VA ]” line to add Italian. Players behind a proxy or relay show
  # up with its address, so they get the relay's country.
  countries:
    ru: [ RU, BY, KZ, KG, TJ, UZ, AM, AZ, MD, GE, TM ]
    es: [ ES, MX, AR, CO, CL, PE, VE, EC, GT, CU, BO, DO, HN, PY, SV, NI, CR, PA, UY, PR, GQ ]
    pt: [ BR, PT, AO, MZ, CV, GW, ST, TL ]
    de: [ DE, AT, CH, LI, LU ]

geoip:
  # The country database: DB-IP's free “IP to Country Lite”, CC BY 4.0, about 4 MB.
  # The plugin downloads it into geoip/ and refreshes it once it's older than
  # refresh_days. Lookups happen on your server; no address leaves it.
  enabled: true
  url: "https://download.db-ip.com/free/dbip-country-lite-{year}-{month}.mmdb.gz"
  refresh_days: 30

auto:
  enabled: true   # Idle players go AFK on their own.
  seconds: 300    # Seconds without activity (see exit_triggers) before they do.

manual:
  enabled: true      # Players may go AFK with /afk [reason].
  reason_length: 64  # Longer reasons get cut.

limits:
  enabled: true   # Kicks players who stay AFK too long.
  seconds: 1200   # How long they may stay AFK: 20 minutes.
  warning:
    enabled: true
    # Seconds before the kick at which the action bar warns them.
    seconds: [ 60, 30, 10, 5, 4, 3, 2, 1 ]

# AFK players don't count when the server checks whether everyone sleeps, so
# one friend away from the keyboard doesn't keep the night going.
sleep_ignored: true

# What AFK players are shielded from.
protection:
  damage: true        # Every kind of damage but /kill. Air doesn't run out under water.
  void: true          # Falling into the void takes them back to where they went AFK.
  knockback: true     # Hits, explosions, and wind charges don't push them.
  collision: true     # Mobs and players walk through them.
  projectiles: true   # Arrows, snowballs, ender pearls, and fishing hooks fly through them.
  effects: true       # Harmful potion effects don't stick, except from commands.
  hunger: true        # Hunger stays put, and so does health: no drain, no natural healing.
  mobs: true          # Mobs don't target them; wardens, endermen, and zombified piglins
                      # don't get angry at them; phantoms don't spawn for them.
  vehicles: true      # Boats and minecarts can't pick them up or push them.
  raids: true         # Bad Omen doesn't start a raid while they stand in a village.
  vibrations: true    # Sculk sensors, shriekers, and wardens don't hear them.

# When a player can't go AFK, so the protection can't save them from a fight.
# Idle players in one of these spots wait to go AFK until it's over.
anti_abuse:
  combat_seconds: 15  # Not within this many seconds of taking damage or hitting a mob or player.
  falling: true       # Not while falling or gliding.
  burning: true       # Not while on fire or freezing.
  liquids: true       # Not in water or lava.
  targeted: true      # Not while a mob nearby is after them.

# What AFK players may still collect.
gains:
  items: false        # Items and arrows stay on the ground.
  experience: false   # Experience orbs wait for them.

# What counts as activity. Each switch that's on ends AFK and restarts the idle
# timer. Being pushed by water, pistons, or a minecart is never activity.
exit_triggers:
  move: true          # The movement keys.
  look: true          # Turning the camera by more than look_degrees.
  look_degrees: 30.0
  jump: true
  sneak: true
  sprint: true
  chat: true
  command: true       # Any command but /afk and /moafks.
  attack: true        # Hitting a mob or a player.
  interact: true      # Clicking a block, an entity, or the air.
  blocks: true        # Breaking or placing a block.
  inventory: true     # Opening a container or clicking in an inventory.
  drop: true
  swap_hands: true
  held_slot: true

sounds:
  enter: { enabled: true, key: "minecraft:block.amethyst_block.chime", volume: 1.0, pitch: 1.0 }
  exit: { enabled: true, key: "minecraft:entity.experience_orb.pickup", volume: 1.0, pitch: 1.0 }
  declined: { enabled: true, key: "minecraft:entity.villager.no", volume: 1.0, pitch: 1.0 }
  warning: { enabled: true, key: "minecraft:block.note_block.pling", volume: 1.0, pitch: 1.0 }

effects:
  # A ring of particles around AFK players, every two seconds.
  particles: { enabled: true, type: "minecraft:happy_villager", radius: 1.5, points: 8 }
  # A mark in front of AFK players' names in the player list. If TAB or another
  # plugin formats the list, it overwrites the mark: turn this off there and put
  # PlaceholderAPI's %moafks_tag% into that plugin's prefix instead.
  nickname:
    enabled: true
    mark: "<gray><italic>[AFK]</italic></gray> "
